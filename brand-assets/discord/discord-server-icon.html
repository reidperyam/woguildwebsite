<!doctype html>
<!-- Source for the Discord server icon. Rendered at 512x512 (and 1024x1024) in a browser with Martian Mono loaded.
     Discord crops server icons to a circle, so the square WO monogram sits inside the circle's safe area. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: #ff2e89; overflow: hidden; }
  .icon { width: 512px; height: 512px; display: grid; place-items: center; background: #ff2e89; }
  .mono {
    box-sizing: border-box; width: 336px; height: 336px;
    border: 26px solid #000000; color: #000000;
    display: flex; align-items: center; justify-content: center;
    font-family: "Martian Mono", monospace; font-weight: 800; font-size: 176px; line-height: 1;
    letter-spacing: -0.06em; padding-left: 0.06em; /* re-centre after the negative tracking */
  }
</style>
</head>
<body><div class="icon"><div class="mono">WO</div></div></body>
</html>
